services:
  - type: web
    name: ddc-digital-pass
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: ddc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: VALID_UNTIL
        value: 2026-11-30
      - key: OFFER_TITLE
        value: A complimentary treat
      - key: OFFER_DESCRIPTION
        value: Enjoy a complimentary item on us at The Daily Drip Cafe. Please confirm the eligible item with our team.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
